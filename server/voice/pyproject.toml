[project]
name = "hyojason-voice"
version = "0.1.0"
description = "효자손 B — 페어·동의·통화(N-01~03), 음성 수신·한국어 STT·발화 확정(N-04~06)"
requires-python = ">=3.11"
# 공통 계약(NodeResult·Basis·Role·Event)은 server/session(D)의 hyojason_session을 그대로 쓴다.
dependencies = ["fastapi>=0.110", "livekit-api>=1.2", "livekit-agents>=1.8", "livekit-plugins-rtzr>=1.8",
                "numpy>=1.26", "onnxruntime>=1.17"]  # numpy·onnxruntime: STT 앞 잡음 제거(denoise.py)

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../session: D 브랜치가 main에 합쳐진 뒤의 경로. 그 전에는 README의 worktree 방법을 쓴다.
pythonpath = [".", "../session"]
